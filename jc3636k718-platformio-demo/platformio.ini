[platformio]
default_envs = jc3636k718_msc

[env]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/53.03.10/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino

monitor_speed = 115200
# TinyUSB CDC only transmits application logs after the host asserts DTR.
# Keep RTS low; 115200 is a normal monitor session (never use 1200 here,
# because 1200 baud intentionally reboots the board into the ROM downloader).
monitor_dtr = 1
monitor_rts = 0
upload_speed = 921600

board_upload.flash_size = 16MB
board_build.flash_mode = dio
board_build.f_flash = 80000000L
board_build.arduino.memory_type = dio_opi
board_build.partitions = partitions_16mb.csv
board_upload.maximum_size = 8388608

build_flags =
    -DBOARD_HAS_PSRAM
    -DCORE_DEBUG_LEVEL=1
    -DLV_CONF_INCLUDE_SIMPLE
    -DLV_LVGL_H_INCLUDE_SIMPLE
    -I include

lib_deps =
    https://github.com/esp-arduino-libs/ESP32_Display_Panel.git#v1.0.4
    https://github.com/esp-arduino-libs/ESP32_IO_Expander.git#v1.1.0
    https://github.com/esp-arduino-libs/esp-lib-utils.git#v0.2.0
    https://github.com/lvgl/lvgl.git#v8.4.0
    bitbank2/JPEGDEC @ 1.8.4

[env:jc3636k718]
build_flags =
    ${env.build_flags}
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DBOARD_DEMO_USB_HID=0
    -DBOARD_DEMO_USB_MSC=0

[env:jc3636k718_hid]
build_unflags =
    -DARDUINO_USB_MODE=1
build_flags =
    ${env.build_flags}
    -DARDUINO_USB_MODE=0
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DBOARD_DEMO_USB_HID=1
    -DBOARD_DEMO_USB_MSC=0

[env:jc3636k718_msc]
build_unflags =
    -DARDUINO_USB_MODE=1
build_flags =
    ${env.build_flags}
    -DARDUINO_USB_MODE=0
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DBOARD_DEMO_USB_HID=0
    -DBOARD_DEMO_USB_MSC=1
